name: Collect research links

on:
  workflow_dispatch:
  schedule:
    # 09:00 JST on Tuesdays, Thursdays, and Saturdays.
    - cron: "0 0 * * 2,4,6"

permissions:
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect research links
        run: npm run research:links > research-links.md

      - name: Create or update research issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing_issue="$(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --search "新着ライブ調査 in:title" \
              --json number \
              --jq '.[0].number'
          )"

          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" \
              --repo "$GH_REPO" \
              --body-file research-links.md
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "新着ライブ調査" \
              --body-file research-links.md
          fi
