name: Collect research links

on:
  workflow_dispatch:
  schedule:
    # 09:00 JST on Tuesdays, Thursdays, and Saturdays.
    - cron: "0 0 * * 2,4,6"

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect research links
        run: npm run research:links > research-links.md

      - name: Generate review candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npm run research:candidates -- --input=research-links.md --report=candidate-report.md --write

      - name: Validate data
        run: npm run data:validate

      - name: Commit generated candidates
        id: candidate_commit
        run: |
          if git diff --quiet -- src/data/candidate_events.ts; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/candidate_events.ts
          git commit -m "Add automated candidate events"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update candidate review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATES_COMMITTED: ${{ steps.candidate_commit.outputs.committed }}
        run: |
          {
            echo "# 候補イベント確認依頼"
            echo
            if [ "$CANDIDATES_COMMITTED" = "true" ]; then
              echo "自動収集で候補イベントを追加しました。"
            else
              echo "今回の自動収集では新規候補の追加はありません。"
            fi
            echo
            echo "/admin/candidates を開いて、review_needed の候補を確認してください。"
            echo
            cat candidate-report.md
          } > candidate-issue.md

          existing_issue="$(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --search "候補イベント確認 in:title" \
              --json number \
              --jq '.[0].number'
          )"

          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" \
              --repo "$GH_REPO" \
              --body-file candidate-issue.md
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "候補イベント確認" \
              --body-file candidate-issue.md
          fi
