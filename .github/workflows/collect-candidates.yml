name: Collect research links

on:
  workflow_dispatch:
  schedule:
    # 09:00 JST every day.
    - cron: "0 0 * * *"

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect research links
        run: npm run research:links > research-links.md

      - name: Generate review candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npm run research:candidates -- --input=research-links.md --report=candidate-report.md --write

      - name: Validate data
        run: npm run data:validate

      - name: Commit generated candidates
        id: candidate_commit
        run: |
          if git diff --quiet -- src/data/candidate_events.ts; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/candidate_events.ts
          git commit -m "Add automated candidate events"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Close older candidate review issues
        if: steps.candidate_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for issue in $(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --search "候補イベント確認 in:title" \
            --json number \
            --jq '.[].number'); do
            gh issue close "$issue" \
              --repo "$GH_REPO" \
              --comment "最新の候補は /admin/candidates に集約されています。新しい候補確認 issue を作成するため、この古い通知 issue は閉じます。"
          done

      - name: Create candidate review issue
        if: steps.candidate_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today="$(TZ=Asia/Tokyo date +%Y-%m-%d)"

          {
            echo "# 候補イベントの確認"
            echo
            echo "自動収集で候補イベントが追加されました。この issue は通知用です。レビューは /admin/candidates だけで行います。"
            echo
            echo "## 確認場所"
            echo
            echo "- /admin/candidates?status=review_needed"
            echo
            echo "## やること"
            echo
            echo "- \`review_needed\` の候補を確認する"
            echo "- 公開するものは「公開」、対象外は「無視」にする"
            echo "- 反映後に push する"
            echo "- 確認が終わったらこの issue を close する"
            echo
            echo "## 今回追加された候補"
            echo
            cat candidate-report.md
          } > candidate-issue.md

          gh issue create \
            --repo "$GH_REPO" \
            --title "候補イベント確認 ${today}" \
            --body-file candidate-issue.md
