name: Collect research links

on:
  workflow_dispatch:
  schedule:
    # 09:00 JST on Tuesdays, Thursdays, and Saturdays.
    - cron: "0 0 * * 2,4,6"

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect research links
        run: npm run research:links > research-links.md

      - name: Generate review candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npm run research:candidates -- --input=research-links.md --report=candidate-report.md --write

      - name: Validate data
        run: npm run data:validate

      - name: Commit generated candidates
        id: candidate_commit
        run: |
          if git diff --quiet -- src/data/candidate_events.ts; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/candidate_events.ts
          git commit -m "Add automated candidate events"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create candidate review issue
        if: steps.candidate_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today="$(TZ=Asia/Tokyo date +%Y-%m-%d)"

          {
            echo "# 候補イベント確認依頼"
            echo
            echo "自動収集で候補イベントを追加しました。"
            echo
            echo "/admin/candidates を開いて、review_needed の候補を確認してください。"
            echo "人間または LLM が候補を確認し、必要な反映が終わったらこの issue を close してください。"
            echo
            cat candidate-report.md
          } > candidate-issue.md

          gh issue create \
            --repo "$GH_REPO" \
            --title "候補イベント確認 ${today}" \
            --body-file candidate-issue.md
