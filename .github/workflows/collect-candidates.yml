name: Collect research links

on:
  workflow_dispatch:
  schedule:
    # 09:00 JST on Tuesdays, Thursdays, and Saturdays.
    - cron: "0 0 * * 2,4,6"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: candidate-collection
  cancel-in-progress: false

jobs:
  pending:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Wait for the current candidate review
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          exists="$(gh pr list --state open --base main --limit 100 --json headRefName --jq 'any(.[]; .headRefName | startswith("automated-candidates"))')"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = "true" ]; then
            echo "Candidate review is pending; collection is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  collect:
    needs: pending
    if: needs.pending.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare candidate branch
        id: candidate_branch
        run: |
          branch_name="automated-candidates-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          git switch -c "$branch_name" origin/main

          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Collect research links
        run: npm run research:links > research-links.md

      - name: Generate review candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npm run research:candidates -- --input=research-links.md --report=candidate-report.md --write

      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      # Validate here as well; later human-authenticated review pushes trigger PR CI.
      - name: Install dependencies
        run: npm ci

      - name: Validate candidate PR
        run: |
          npm run data:validate
          npm run copy:check
          npm run build

      - name: Commit generated candidates
        id: candidate_commit
        run: |
          if git diff --quiet -- src/data/candidate_events.ts; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch_name="${{ steps.candidate_branch.outputs.branch_name }}"
          git add src/data/candidate_events.ts
          git commit -m "Add automated candidate events"
          git push -u origin "$branch_name"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Create candidate review pull request
        id: candidate_pr
        if: steps.candidate_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today="$(TZ=Asia/Tokyo date +%Y-%m-%d)"

          {
            echo "## 概要"
            echo
            echo "自動収集で候補イベントが追加されました。"
            echo "本番データへ直接反映せず、PR上で差分を確認してからマージします。"
            echo
            echo "## 確認場所"
            echo
            echo "- /admin/candidates?status=review_needed"
            echo
            echo "## 今回追加された候補"
            echo
            cat candidate-report.md
            echo
            echo "## 確認"
            echo
            echo "- npm run data:validate / npm run copy:check / npm run build"
          } > candidate-pr.md

          pr_url="$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --head "${{ steps.candidate_commit.outputs.branch_name }}" \
            --json url \
            --jq '.[0].url // ""')"

          if [ -n "$pr_url" ]; then
            gh pr edit "$pr_url" \
              --repo "$GH_REPO" \
              --title "候補イベントを追加する ${today}" \
              --body-file candidate-pr.md
          else
            pr_url="$(gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head "${{ steps.candidate_commit.outputs.branch_name }}" \
              --title "候補イベントを追加する ${today}" \
              --body-file candidate-pr.md)"
          fi

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Close older candidate review issues
        if: steps.candidate_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for issue in $(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --search "候補イベント確認 in:title" \
            --json number \
            --jq '.[].number'); do
            gh issue close "$issue" \
              --repo "$GH_REPO" \
              --comment "最新の候補は /admin/candidates に集約されています。新しい候補確認 issue を作成するため、この古い通知 issue は閉じます。"
          done

      - name: Create candidate review issue
        if: steps.candidate_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today="$(TZ=Asia/Tokyo date +%Y-%m-%d)"

          {
            echo "# 候補イベントの確認"
            echo
            echo "自動収集で候補イベントが追加されました。この issue は通知用です。レビューは /admin/candidates とPR差分で行います。"
            echo
            echo "## PR"
            echo
            echo "- ${{ steps.candidate_pr.outputs.pr_url }}"
            echo
            echo "## 確認場所"
            echo
            echo "- /admin/candidates?status=review_needed"
            echo
            echo "## やること"
            echo
            echo "- \`review_needed\` の候補を確認する"
            echo "- ローカルで npm run candidates:review -- PR番号 を起動する"
            echo "- 公開するものは「採用」、対象外は「無視」にする（同じPRへ自動保存）"
            echo "- PRの差分を確認して、問題なければマージする"
            echo "- 確認が終わったらこの issue を close する"
            echo
            echo "## 今回追加された候補"
            echo
            cat candidate-report.md
          } > candidate-issue.md

          gh issue create \
            --repo "$GH_REPO" \
            --title "候補イベント確認 ${today}" \
            --body-file candidate-issue.md
