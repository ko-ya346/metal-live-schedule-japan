name: Remind event candidate collection

on:
  workflow_dispatch:
  schedule:
    # 09:00 JST on Tuesdays, Thursdays, and Saturdays.
    - cron: "0 0 * * 2,4,6"

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing_issue="$(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --search "新着ライブ調査 in:title" \
              --json number \
              --jq '.[0].number'
          )"

          if [ -n "$existing_issue" ]; then
            echo "Collection reminder already exists: #$existing_issue"
            exit 0
          fi

          gh issue create \
            --repo "$GH_REPO" \
            --title "新着ライブ調査" \
            --body "$(cat <<'BODY'
          Codexに新着ライブ調査を依頼する。

          依頼文:

          ```text
          新着ライブを調べて、候補イベントを src/data/candidate_events.ts に review_needed で追加してください。
          公開イベントには追加しないでください。
          公式/信頼できるソースを優先してください。
          npm run data:validate と npm run build を通してください。
          ```

          確認するもの:

          - [ ] Creativeman
          - [ ] UDO
          - [ ] SMASH
          - [ ] Evoken / EVP
          - [ ] eplus metal / hardcore
          - [ ] 主要会場スケジュール
          - [ ] SEX MACHINEGUNS
          - [ ] 人間椅子
          - [ ] アイリフドーパ
          - [ ] 来日メタル/ハードロック/ラウド系公演

          作業後:

          - [ ] /admin/candidates で候補を確認
          - [ ] 公開するものだけ公開
          - [ ] 対象外は ignore
          - [ ] 必要ならX投稿
          - [ ] push
          BODY
          )"
